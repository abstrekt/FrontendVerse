<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JavaScript MCQ Quiz</title>
    <meta
      name="description"
      content="Practise JavaScript with multiple-choice questions, output prediction, coding challenges and written learnings — with progress tracking, spaced repetition and full keyboard support."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG here, so this must be a raster icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Self-hosted and used on every screen, so preloading removes a round
         trip from the critical path. Both are variable fonts: one file each. -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#f0f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="JavaScript MCQ Quiz" />
    <meta
      property="og:description"
      content="Practise JavaScript with multiple-choice questions, output prediction, coding challenges and written learnings."
    />
    <meta name="twitter:card" content="summary" />

    <!--
      Applied before first paint. Without this, a user whose resolved theme is
      dark gets a white flash on every load while React boots. Reads both the
      stored theme and its source, so "follow the system" survives a reload.
    -->
    <script>
      (function () {
        try {
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
          var source = JSON.parse(localStorage.getItem('quiz-theme-source'));
          var stored = JSON.parse(localStorage.getItem('quiz-theme'));
          // Anyone who used the app before the tri-state control existed has
          // no source key. Treating that as 'system' is the intended default.
          var theme =
            source === 'user' && (stored === 'dark' || stored === 'light')
              ? stored
              : system;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          max-width: 40rem;
          margin: 4rem auto;
          padding: 0 1.5rem;
          font-family: system-ui, sans-serif;
          line-height: 1.6;
        "
      >
        <h1>JavaScript MCQ Quiz</h1>
        <p>
          This quiz runs your answers against a real JavaScript engine in your browser, so it
          needs JavaScript enabled. Please turn it on and reload.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
